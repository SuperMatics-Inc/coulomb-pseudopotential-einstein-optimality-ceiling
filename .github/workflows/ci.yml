name: replay-and-paper
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHON_VERSION: '3.12'
  DEPS: 'numpy==2.5.5 scipy==1.18.1 mpmath==1.4.1 sympy==1.14.0'
  PDF_SHA256: '9d3bd9975260cc255a6f1b30dd56d018ae6e5afbaaa6b4cee5c24f5387a3bb55'
jobs:
  tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Source manifests
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          sha256sum -c ADMITTED.sha256
          test "$(wc -l < MANIFEST.sha256)" = "$(wc -l < ADMITTED.sha256)"
          total=$(find . -type f -not -path './.git/*' | wc -l)
          test $((total - 2)) -eq "$(wc -l < MANIFEST.sha256)"
      - name: Forbidden-file and release-tree policy
        run: |
          set -euo pipefail
          # Policy scratch files live outside the tree so the untracked-file check stays honest.
          P=$(mktemp -d)
          git ls-files > "$P/tracked.txt"
          # Root carries only the release documents, the workflow and the manifest pair.
          cat > "$P/allowed-root.txt" <<'EOF'
          .gitattributes
          .github/replay.sh
          .github/workflows/ci.yml
          ADMITTED.sha256
          BUILD.md
          CITATION.cff
          CLAIMS.md
          LICENSE
          MANIFEST.sha256
          README.md
          EOF
          # paper/ carries the manuscript sources and the released PDF, nothing else.
          printf 'paper/main.tex\npaper/main.pdf\npaper/refs.bib\n' > "$P/allowed-paper.txt"
          awk -F/ 'NF==1 || ($1==".github")' "$P/tracked.txt" | sort > "$P/root-actual.txt"
          sort "$P/allowed-root.txt" > "$P/root-allowed-sorted.txt"
          if ! diff -u "$P/root-allowed-sorted.txt" "$P/root-actual.txt"; then
            echo 'unexpected file in the repository root or .github/'; exit 1
          fi
          grep -E '^paper/' "$P/tracked.txt" | sort > "$P/paper-actual.txt"
          sort "$P/allowed-paper.txt" > "$P/paper-allowed-sorted.txt"
          if ! diff -u "$P/paper-allowed-sorted.txt" "$P/paper-actual.txt"; then
            echo 'unexpected file in paper/'; exit 1
          fi
          if grep -nE '^([^/]+/)?[^/]*\.v[0-9]+\.' "$P/tracked.txt"; then
            echo 'backup copy of a versioned file'; exit 1
          fi
          if grep -nE '\.(log|blg|aux|toc|out|bbl|synctex\.gz|zip|tar|tar\.gz|tgz|orig|rej|bak)$' "$P/tracked.txt"; then
            echo 'build log, archive or patch residue'; exit 1
          fi
          if grep -nE '(^|/)(NOTES|PAPER-REVIEW|FIX-PAPER-REVIEW)[^/]*$' "$P/tracked.txt"; then
            echo 'release-process notes'; exit 1
          fi
          if grep -vE '^paper/main\.pdf$' "$P/tracked.txt" | grep -nE '\.pdf$'; then
            echo 'PDF outside paper/main.pdf'; exit 1
          fi
          if grep -nE '(^|/)(\.env|secrets[^/]*|id_rsa[^/]*|.*\.pem)$' "$P/tracked.txt"; then
            echo 'credential file'; exit 1
          fi
          if git ls-files --others --exclude-standard | grep -q .; then
            git ls-files --others --exclude-standard
            echo 'untracked file in the release tree'; exit 1
          fi
          rm -rf "$P"
      - name: Release identifiers
        run: |
          set -euo pipefail
          grep -qF 'Version 2.0.0' README.md
          grep -qF '10.5281/zenodo.24416391' README.md
          grep -qF '10.5281/zenodo.24416392' README.md
          grep -qF '10.5281/zenodo.24409773' README.md
          grep -qF '10.5281/zenodo.24409779' README.md
          grep -qF 'version: 2.0.0' CITATION.cff
          grep -qF 'doi: 10.5281/zenodo.24416392' CITATION.cff
          grep -qF 'doi: 10.5281/zenodo.24416391' CITATION.cff
          grep -qF '## 15. Version 2 pre-release review fixes' CLAIMS.md
          grep -qF '## Bytes at this build (Version 2)' BUILD.md
          grep -qF "$PDF_SHA256" BUILD.md
      - name: Public prose safeguards
        run: |
          set -euo pipefail
          if grep -nF '—' paper/main.tex README.md; then exit 1; fi
          # README names the released bracket record directory C-LAMBDA/ (the record
          # scripts read C-LAMBDA/brackets.json by that name); scan a copy with that
          # one repository path removed so every other lane, agent and machine name still fails.
          sed -E 's#C-LAMBDA/#<bracket-record>/#g' README.md > readme.scan
          if grep -nE '\b(CUTOFF-PAPER|MUSTAR|C-LAMBDA|BARRIERS2|ADIABATIC|PURESSH|STATIC-MODE|MASSIVE)[[:alnum:]_-]*|ceiling-20261118|D:/|C:/t|\bMac\b|\blane\b|reserved DOI|awaits review|subagent|Codex|Claude' paper/main.tex readme.scan; then exit 1; fi
          rm -f readme.scan
          # `scratch` alone is the English word ("from scratch"); only a scratch path is private.
          if grep -rInE 'D:/|C:/|/home/runner|/Users/|scratch/|/scratch|MIKUSSY|subagent|Codex|Claude' \
               --include='*.md' --include='CHECKS.txt' . ; then exit 1; fi
          grep -qF 'This preprint has not been peer reviewed.' paper/main.tex
          grep -qF 'This preprint has not been peer reviewed.' README.md
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: tree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned replay dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check $DEPS
          python -c "import numpy, scipy, mpmath, sympy; print(numpy.__version__, scipy.__version__, mpmath.__version__, sympy.__version__)"
      - name: Every verifier, self-test and mutant in the checkout
        run: |
          set -euo pipefail
          bash .github/replay.sh
          git diff --exit-code --stat
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: tree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Unpack git archive HEAD
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive"
          git archive --format=tar --prefix=tree/ HEAD | tar -x -C "$RUNNER_TEMP/archive"
          find "$RUNNER_TEMP/archive/tree" -type f | wc -l
      - name: The unpacked archive carries the manifest bytes
        working-directory: ${{ runner.temp }}/archive/tree
        run: |
          set -euo pipefail
          sha256sum -c MANIFEST.sha256
          test "$(find . -type f | wc -l)" -eq "$(( $(wc -l < MANIFEST.sha256) + 2 ))"
          test ! -e .git
      - name: Install pinned replay dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check $DEPS
          python -c "import numpy, scipy, mpmath, sympy; print(numpy.__version__, scipy.__version__, mpmath.__version__, sympy.__version__)"
      - name: Every verifier, self-test and mutant in the unpacked archive
        working-directory: ${{ runner.temp }}/archive/tree
        run: |
          set -euo pipefail
          bash .github/replay.sh
          find . -type f | wc -l
          test "$(find . -type f | wc -l)" -eq "$(( $(wc -l < MANIFEST.sha256) + 2 ))"
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tree
    env:
      SOURCE_DATE_EPOCH: "1795132800"
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic and poppler
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          tectonic --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the manuscript and compare the PDF bytes
        working-directory: paper
        run: |
          set -euo pipefail
          tectonic --keep-logs main.tex
          if grep -nE 'Overfull|Underfull|Undefined|Citation.*undefined|There were undefined' main.log; then exit 1; fi
          test -s main.pdf
          sha256sum main.pdf
          echo "$PDF_SHA256  main.pdf" | sha256sum -c -
          pdfinfo -url main.pdf > urls.txt
          grep -qF 'https://orcid.org/0000-0001-5839-5197' urls.txt || { cat urls.txt; echo 'ORCID link missing from the PDF annotations'; exit 1; }
          pdftotext main.pdf main.txt
          if grep -nF '—' main.txt; then exit 1; fi
          if grep -nE '\b(CUTOFF-PAPER|MUSTAR|C-LAMBDA|BARRIERS2|ADIABATIC|PURESSH|STATIC-MODE|MASSIVE)[[:alnum:]_-]*|ceiling-20261118|D:/|C:/t|\bMac\b|\blane\b|reserved DOI|awaits review' main.txt; then exit 1; fi
          if grep -nE '10\.5281/zenodo\.2441639[12]' main.txt; then echo 'Version 2 DOI inside the manuscript bytes'; exit 1; fi
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'This preprint has not been peer reviewed.' || { echo 'peer-review sentence missing'; exit 1; }
          tr -s '[:space:]' ' ' < main.txt | grep -qF 'separate AI agents carried out the independent reviews' || { echo 'AI disclosure sentence missing'; exit 1; }
          pdfinfo main.pdf | grep -E '^Pages:' 
          test "$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')" -eq 26
      - uses: actions/upload-artifact@v4
        with:
          name: coulomb-pseudopotential-einstein-optimality-paper
          path: |
            paper/main.pdf
            paper/main.log
            paper/main.tex
            paper/refs.bib
            paper/urls.txt
          if-no-files-found: error
